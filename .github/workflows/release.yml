name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      distTag:
        description: 'NPM tag (e.g. use "next" to release a test version)'
        required: false
        type: string
        default: 'latest'
      releaseType:
        description: 'Release type for monorepo root (drives the v* tag)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # The pin bump below opens a PR rather than pushing to main.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.26.1
          run_install: true
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Consume changesets
        run: npx changeset version

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.distTag }}
        run: npx changeset publish --tag "${DIST_TAG}" --no-git-tag

      - name: GitHub Release & Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(npm version ${{ inputs.releaseType }})
          git push origin main
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      # `BACKEND_NPM_VERSION` is the backend a `pip install` user actually runs,
      # and nothing derives it: the Python adapter is not in the pnpm workspace,
      # so changesets never sees it. Left to a human it is remembered late —
      # `check_backend_pin.py` then fails every Python CI run and blocks the
      # PyPI publish until someone edits one line.
      #
      # Opened as a PR, never pushed to main: the new backend has to be ON npm
      # for the check to pass, which is why this runs after Publish, and a pin
      # is a claim about a published artifact that deserves a review.
      #
      # A PR raised with GITHUB_TOKEN gets no CI — GitHub suppresses workflow
      # runs for events its own token raises, to stop recursion. Set
      # PIN_BUMP_TOKEN (a PAT or App token) and the checks run on their own;
      # without it the PR needs a nudge, which its body says.
      #
      # Only for a `latest` release: the pin is what a `pip install` user gets,
      # and a `next` publish is a test version nobody should be moved onto.
      - name: Open the Python backend pin bump
        if: inputs.distTag == 'latest' || inputs.distTag == ''
        env:
          GITHUB_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          PIN_FILE: packages/selenium-devtools-py/src/selenium_devtools/constants.py
        run: |
          set -euo pipefail
          BACKEND=$(node -p "require('./packages/backend/package.json').version")
          PIN=$(sed -n 's/^BACKEND_NPM_VERSION = "\(.*\)"$/\1/p' "$PIN_FILE")
          if [ -z "$PIN" ]; then
            echo "::error::No BACKEND_NPM_VERSION found in $PIN_FILE"
            exit 1
          fi
          if [ "$BACKEND" = "$PIN" ]; then
            echo "Backend unchanged at $PIN — nothing to bump."
            exit 0
          fi
          # This value reaches a `sed` expression and a branch name. It comes
          # from our own package.json, so this is a belt rather than a fix for
          # a known hole — but a stray `/` would silently corrupt the pin.
          case "$BACKEND" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::Backend version is not plain semver: $BACKEND"
              exit 1
              ;;
          esac

          BRANCH="chore/pin-backend-$BACKEND"
          FRAGMENT="packages/selenium-devtools-py/changes/pin-backend-$BACKEND.md"
          # -C, not -c: a re-run of a release that already reached this step
          # (publish succeeded, something after it did not) finds its own branch
          # already there, and `-c` would fail the step AFTER publication.
          git switch -C "$BRANCH"
          sed -i "s/^BACKEND_NPM_VERSION = .*/BACKEND_NPM_VERSION = \"$BACKEND\"/" "$PIN_FILE"
          # Required, not decorative: python.yml refuses a branch that changes
          # `src/` and documents nothing, so a pin-only PR would fail its own CI.
          printf -- '---\npatch\n---\n\nPin the backend a `pip install` user runs to %s.\n' \
            "$BACKEND" > "$FRAGMENT"
          # Named explicitly because the fragment is UNTRACKED: `commit -a`
          # stages modified tracked files only, so it would ship the pin without
          # the fragment that makes the pin mergeable.
          git add "$PIN_FILE" "$FRAGMENT"
          git commit -m "chore(python): pin the backend to $BACKEND"
          # The branch is bot-owned and named for the version, so the only thing
          # a force can overwrite is this same bump from an earlier failed run.
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "A pin PR for $BACKEND is already open — pushed to it instead."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(python): pin the backend to $BACKEND" \
            --body "$(printf '%s\n' \
              "\`@wdio/devtools-backend@$BACKEND\` is published, so the version a \`pip install\` user runs can move up from $PIN." \
              "" \
              "Opened by the npm release. \`scripts/check_backend_pin.py\` is what decides whether this pin is serviceable — it asks the published tarball whether it carries every contract name the adapter needs, so let that check run before merging." \
              "" \
              "If this PR shows no checks, it was raised with \`GITHUB_TOKEN\`, which GitHub will not let start a workflow. Close and reopen it, or push an empty commit, to get CI." )"
