[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-devtools-py"
version = "0.1.0"
description = "Python Selenium adapter for the WebdriverIO DevTools dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WebdriverIO" }]
keywords = ["selenium", "webdriver", "devtools", "pytest", "debugging"]

# Transport is dependency-free (stdlib). selenium is the user's own dep; we
# only patch it when present, so it's not a hard requirement to import.
dependencies = []

[project.optional-dependencies]
# Deliberately UNCAPPED, even though network capture needs selenium < 4.44 (that
# release regenerated the BiDi layer, moving the internals `bidi.py` subscribes
# through; issue #293). A cap here would downgrade anyone already on a newer
# selenium, and hard-fail the install for a project that requires one — a cost
# paid by every user to describe a partial degradation that only affects the
# Network tab. `bidi.py` reports it at runtime instead, naming the version.
selenium = ["selenium>=4.6"]
# The TEST environment is capped, because the surface guards assert against
# whatever is installed and only mean something on a version the adapter fully
# supports. Constraining the dev environment costs no user anything.
test = ["pytest>=7", "selenium>=4.6,<4.44"]

# Auto-discovered by pytest; inert unless DEVTOOLS_ENABLE / DEVTOOLS_PORT is set.
[project.entry-points.pytest11]
selenium_devtools = "selenium_devtools.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/selenium_devtools"]
