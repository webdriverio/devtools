[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-devtools-py"
version = "0.1.0"
description = "Python Selenium adapter for the WebdriverIO DevTools dashboard"
readme = "README.md"
# >=3.10 because selenium 4.44 requires it, and network capture needs 4.44+.
# Not an independent choice: 3.9 left security support in October 2025.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WebdriverIO" }]
keywords = ["selenium", "webdriver", "devtools", "pytest", "debugging"]

# Transport is dependency-free (stdlib). selenium is the user's own dep; we
# only patch it when present, so it's not a hard requirement to import.
dependencies = []

[project.optional-dependencies]
# 4.44 is where selenium regenerated the BiDi layer, and with it the public
# event API network capture subscribes through. Earlier versions offered only a
# private connection, which 4.44 removed — supporting both would mean carrying
# two subscription paths for releases that predate this package's own first one.
# Uncapped above: 4.44+ is a floor, not a range.
selenium = ["selenium>=4.44"]
test = ["pytest>=7", "selenium>=4.44"]

# Auto-discovered by pytest; inert unless DEVTOOLS_ENABLE / DEVTOOLS_PORT is set.
[project.entry-points.pytest11]
selenium_devtools = "selenium_devtools.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/selenium_devtools"]
