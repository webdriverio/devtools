[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-devtools-py"
version = "0.1.0"
description = "Python Selenium adapter for the WebdriverIO DevTools dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WebdriverIO" }]
keywords = ["selenium", "webdriver", "devtools", "pytest", "debugging"]

# Transport is dependency-free (stdlib). selenium is the user's own dep; we
# only patch it when present, so it's not a hard requirement to import.
dependencies = []

[project.optional-dependencies]
# Uncapped on both sides. selenium 4.44 regenerated the BiDi layer and moved the
# internals network capture subscribes through; `bidi.py` now has a path for each
# surface, so there is no range to exclude. The CI matrix is what keeps that
# honest — its 3.9 job resolves a pre-4.44 selenium and its 3.12 job the latest,
# so both paths run on every PR.
selenium = ["selenium>=4.6"]
test = ["pytest>=7", "selenium>=4.6"]

# Auto-discovered by pytest; inert unless DEVTOOLS_ENABLE / DEVTOOLS_PORT is set.
[project.entry-points.pytest11]
selenium_devtools = "selenium_devtools.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/selenium_devtools"]
