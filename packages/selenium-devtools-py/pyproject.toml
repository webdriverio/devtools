[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-devtools-py"
version = "0.1.0"
description = "Python Selenium adapter for the WebdriverIO DevTools dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WebdriverIO" }]
keywords = ["selenium", "webdriver", "devtools", "pytest", "debugging"]

# Transport is dependency-free (stdlib). selenium is the user's own dep; we
# only patch it when present, so it's not a hard requirement to import.
dependencies = []

# Capped below 4.44: that release regenerated the BiDi layer from a schema and
# took `NetworkEvent` out of `bidi.network` while renaming `Network.conn` to
# `_conn` — the two internals `bidi.py` subscribes to network events through.
# Console capture and the document-start preload are unaffected. The cap states
# a breakage that already exists rather than causing one; lifting it needs the
# port to the new `_event_manager` surface (issue #293).
[project.optional-dependencies]
selenium = ["selenium>=4.6,<4.44"]
test = ["pytest>=7", "selenium>=4.6,<4.44"]

# Auto-discovered by pytest; inert unless DEVTOOLS_ENABLE / DEVTOOLS_PORT is set.
[project.entry-points.pytest11]
selenium_devtools = "selenium_devtools.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/selenium_devtools"]
