# Tempo config of grafana/otel-lgtm:0.37.0 (/otel-lgtm/tempo-config.yaml) with two changes; re-copy from the image when its tag changes.
# max_traces_per_user 0 lifts the 10000 live-trace limit that silently drops half of a 20000-test push; ingestion_time_range_slack 24h lets spans that ended before the push still count (measured to 97 minutes).
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 0
    metrics_generator:
      processors: [service-graphs, span-metrics]

live_store:
  wal:
    ingestion_time_range_slack: 24h
