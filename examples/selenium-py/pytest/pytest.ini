; DevTools capture, committed with the project: pytest reads this file because
; it sits beside the tests, so a contributor who clones the repo gets the same
; capture without flags or exported variables.
;
; Run it from the repo root:
;   pnpm demo:python:pytest                          ; live dashboard
;   DEVTOOLS_MODE=trace pnpm demo:python:pytest      ; one archive per failing test
;   pnpm show-trace examples/selenium-py/pytest/test-results/*.zip
;
; DEVTOOLS_MODE is this example's switch, not the adapter's: conftest.py turns
; `trace` into devtools_trace = true, devtools_trace_granularity = test and
; devtools_trace_policy = retain-on-failure, each only where nothing else chose.
;
; Override one setting for one run without editing this file:
;   pytest -o devtools_trace_policy=on examples/selenium-py/pytest/      ; trace, keep all
;   pytest -o devtools=false examples/selenium-py/pytest/                ; capture nothing

[pytest]

; Capture is always opt-in: the plugin auto-loads wherever the package is
; installed, so it must never change a suite that did not ask.
; Precedence, highest first: CLI flag > this file > environment
; (DEVTOOLS_ENABLE=1 or DEVTOOLS_PORT=<n>).
devtools = true

; Every other setting, for reference (all unset here, so the run is live):
;
; devtools_trace = true|false
;   true writes an archive to test-results/ and opens no window; false (the
;   default) streams to the dashboard.
;
; devtools_trace_granularity = session|test
;   one archive for the run (default), or one per test holding only that test's
;   commands, console, network, DOM, a11y trees and screencast frames.
;
; devtools_trace_policy = on|retain-on-failure|retain-on-first-failure|...
;   which archives to keep; `on` (default) keeps all. The retry-aware values
;   behave like retain-on-failure here: nothing this adapter sends carries an
;   attempt number.
;
; A policy or granularity implies devtools_trace = true, except where
; devtools_trace = false is set explicitly at the same level or a higher one
; (CLI > this file); then it does nothing and the run logs a line saying so.
;
; Environment-only: DEVTOOLS_HOST, DEVTOOLS_BACKEND_CMD, DEVTOOLS_BIDI=0,
; DEVTOOLS_OPEN=0, DEVTOOLS_FILMSTRIP=0, DEVTOOLS_A11Y=0. DEVTOOLS_TRACE=1
; selects trace mode for an opted-in run but does not opt one in, and
; DEVTOOLS_TRACE_POLICY / DEVTOOLS_TRACE_GRANULARITY act only in trace mode.
; The same choices in a plain script go to devtools.enable() (see ../scripts/login.py).
